name: Sync daily English widget
on:
  schedule:
    - cron: '10 15 * * *' # 00:10 KST every day
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: english-widget-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch all four fields from Google Sheets web app
        env:
          BASE_URL: https://script.google.com/macros/s/AKfycbzMF0Q0jellV1pWMDCzR_1wsWr5O8spD-CAkef4_kwpoDgEWfuCzRoJL3px50EiavQKjQ/exec
        run: |
          python3 - <<'PY'
          import os, urllib.request, urllib.parse
          fields = {
              "phrase": "today.txt",
              "meaning": "meaning.txt",
              "example": "example.txt",
              "translation": "translation.txt",
          }
          values = {}
          for field, filename in fields.items():
              url = os.environ["BASE_URL"] + "?" + urllib.parse.urlencode({"field": field})
              req = urllib.request.Request(url, headers={"User-Agent": "EnglishWidgetSync/1.0"})
              with urllib.request.urlopen(req, timeout=40) as response:
                  value = response.read().decode("utf-8-sig").strip()
              if not value or len(value) > 1500 or "<html" in value.lower() or "<!doctype" in value.lower() or "\n" in value:
                  raise ValueError(f"Invalid response for {field}; no files will be updated")
              values[filename] = value
          if len(set(values.values())) < 4:
              raise ValueError("Fields are not distinct; check Apps Script field support")
          for filename, value in values.items():
              with open(filename, "w", encoding="utf-8") as output:
                  output.write(value + "\n")
          print("Validated all four fields")
          PY
      - name: Commit all changed fields together
        run: |
          if git diff --quiet -- today.txt meaning.txt example.txt translation.txt; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add today.txt meaning.txt example.txt translation.txt
          git commit -m "Sync daily English widget fields"
          git push
